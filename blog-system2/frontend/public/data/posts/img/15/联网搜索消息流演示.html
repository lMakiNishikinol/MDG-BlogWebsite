<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联网搜索消息流演示</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #20262b;
      --muted: #66717b;
      --line: #d8d2c7;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --green: #0f766e;
      --green-soft: #ccfbf1;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --violet: #6d28d9;
      --violet-soft: #ede9fe;
      --gray-soft: #f4f4f5;
      --shadow: 0 12px 32px rgba(32, 38, 43, 0.10);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      width: min(1220px, calc(100vw - 32px));
      margin: 28px auto;
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 860px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
    }

    .question {
      margin: 16px 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .question-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .question-text {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.35;
    }

    .layout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .panel {
      min-height: 690px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfaf7;
    }

    .panel-title {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .panel-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(32, 38, 43, 0.03);
    }

    button.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #ffffff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .stream {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 610px;
      padding: 16px;
      overflow-y: auto;
      scroll-behavior: smooth;
      background:
        linear-gradient(#ffffff, #ffffff) padding-box,
        repeating-linear-gradient(0deg, rgba(37, 99, 235, 0.04), rgba(37, 99, 235, 0.04) 1px, transparent 1px, transparent 34px);
    }

    .message {
      display: grid;
      gap: 6px;
      opacity: 0;
      transform: translateY(8px);
      animation: rise 220ms ease forwards;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .role {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: lowercase;
    }

    .bubble {
      width: min(100%, 560px);
      border: 1px solid #d7dce2;
      border-radius: var(--radius);
      padding: 11px 12px;
      background: #f8fafc;
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.user .role {
      margin-left: auto;
    }

    .message.user .bubble {
      background: var(--blue-soft);
      border-color: #bfdbfe;
    }

    .message.system .role {
      background: var(--gray-soft);
      color: #52525b;
    }

    .message.user .role {
      background: var(--blue);
      color: white;
    }

    .message.llm .role {
      background: var(--green-soft);
      color: #134e4a;
    }

    .message.tools .role {
      background: var(--violet-soft);
      color: var(--violet);
    }

    .message.tool .role {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .message.llm .bubble {
      background: #f0fdfa;
      border-color: #99f6e4;
    }

    .message.tools .bubble {
      background: #f5f3ff;
      border-color: #ddd6fe;
    }

    .message.tool .bubble {
      background: #fffbeb;
      border-color: #fde68a;
    }

    .json {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
    }

    .cursor::after {
      content: "";
      display: inline-block;
      width: 7px;
      height: 1em;
      margin-left: 2px;
      background: currentColor;
      vertical-align: -2px;
      animation: blink 900ms steps(2, start) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .empty-state {
      margin: auto;
      max-width: 360px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
    }

    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        min-height: 560px;
      }

      .stream {
        height: 500px;
      }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100vw - 20px, 1220px);
        margin: 18px auto;
      }

      h1 {
        font-size: 23px;
      }

      .question-text {
        font-size: 18px;
      }

      .panel-header {
        display: block;
      }

      .controls {
        justify-content: flex-start;
        margin-top: 10px;
      }

      .stream {
        height: 520px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>联网搜索打开前后，模型看到了什么</h1>
      <p class="lead">教学版消息流演示。右侧搜索结果为模拟数据，用来展示“工具描述作为模型可见信息、模型输出工具调用、外部工具返回结果、结果进入下一轮上下文”的过程。</p>
    </header>

    <section class="question" aria-label="用户问题">
      <span class="question-label">用户问题</span>
      <div class="question-text">DeepSeek 最近发布了什么模型？</div>
    </section>

    <section class="layout">
      <article class="panel">
        <div class="panel-header">
          <div>
            <h2 class="panel-title">关闭联网搜索</h2>
            <p class="panel-subtitle">模型只能基于已有上下文回答。</p>
          </div>
          <div class="controls">
            <button class="primary" id="playOffBtn" type="button">开始自动播放</button>
            <button id="resetOffBtn" type="button">重置</button>
          </div>
        </div>
        <div class="stream" id="streamOff" aria-label="关闭联网搜索消息流">
          <div class="empty-state">点击“开始自动播放”，查看关闭联网搜索时的消息流。</div>
        </div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <div>
            <h2 class="panel-title">开启联网搜索</h2>
            <p class="panel-subtitle">模型看到工具说明后，可以生成搜索请求，由外部工具执行。</p>
          </div>
          <div class="controls">
            <button class="primary" id="playOnBtn" type="button">开始自动播放</button>
            <button id="resetOnBtn" type="button">重置</button>
          </div>
        </div>
        <div class="stream" id="streamOn" aria-label="开启联网搜索消息流">
          <div class="empty-state">点击“开始自动播放”，查看开启联网搜索时的消息流。</div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const delayBetweenMessages = 460;
    const typeDelay = 12;

    const flows = {
      off: [
        {
          role: "system",
          content: "你是一个 AI 助手。"
        },
        {
          role: "user",
          content: "DeepSeek 最近发布了什么模型？"
        },
        {
          role: "llm",
          stream: true,
          content: "我无法确认 DeepSeek 最近发布了什么模型。我的回答只能基于当前上下文和已有知识；如果需要最新信息，需要查看官方公告或开启联网搜索。"
        }
      ],
      on: [
        {
          role: "system",
          content: "你是一个 AI 助手。遇到需要最新信息的问题时，可以使用可用工具。"
        },
        {
          role: "tools",
          format: "json",
          content: `[
  {
    "name": "web_search",
    "description": "搜索网页并返回摘要结果。",
    "parameters": {
      "query": {
        "type": "string",
        "description": "搜索关键词，必须提供。"
      },
      "max_results": {
        "type": "integer",
        "description": "最多返回几条结果，默认 3。"
      }
    }
  }
]`
        },
        {
          role: "user",
          content: "DeepSeek 最近发布了什么模型？"
        },
        {
          role: "llm",
          stream: true,
          format: "json",
          content: `{
  "tool": "web_search",
  "arguments": {
    "query": "DeepSeek 最近发布 新模型 官方公告",
    "max_results": 3
  }
}`
        },
        {
          role: "tool",
          format: "json",
          content: `[
  {
    "source": "deepseek.com",
    "title": "DeepSeek V4 Pro 今日起正式上线网页端和 API",
    "snippet": "DeepSeek 发布 V4 Pro 模型，支持网页端与 API 调用。"
  },
  {
    "source": "deepseek.com/blog",
    "title": "DeepSeek V4 Pro 技术报告发布",
    "snippet": "报告介绍了模型能力、上下文长度和推理性能。"
  },
  {
    "source": "docs.deepseek.com",
    "title": "DeepSeek API 模型列表更新",
    "snippet": "模型列表新增 deepseek-v4-pro。"
  }
]`
        },
        {
          role: "llm",
          stream: true,
          content: "根据搜索结果，DeepSeek 最近发布的是 DeepSeek V4 Pro。它已上线网页端和 API，官方也同步更新了技术报告与 API 模型列表。"
        }
      ]
    };

    const players = {
      off: {
        stream: document.getElementById("streamOff"),
        playBtn: document.getElementById("playOffBtn"),
        resetBtn: document.getElementById("resetOffBtn"),
        timer: null,
        index: 0,
        running: false,
        done: false,
        emptyText: "点击“开始自动播放”，查看关闭联网搜索时的消息流。"
      },
      on: {
        stream: document.getElementById("streamOn"),
        playBtn: document.getElementById("playOnBtn"),
        resetBtn: document.getElementById("resetOnBtn"),
        timer: null,
        index: 0,
        running: false,
        done: false,
        emptyText: "点击“开始自动播放”，查看开启联网搜索时的消息流。"
      }
    };

    function createMessage(item) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${item.role}`;

      const role = document.createElement("div");
      role.className = "role";
      role.textContent = item.role;

      const bubble = document.createElement("div");
      bubble.className = item.format === "json" ? "bubble json" : "bubble";

      wrapper.appendChild(role);
      wrapper.appendChild(bubble);
      return { wrapper, bubble };
    }

    function clearEmpty(player) {
      const empty = player.stream.querySelector(".empty-state");
      if (empty) empty.remove();
    }

    function showEmpty(player) {
      player.stream.innerHTML = `<div class="empty-state">${player.emptyText}</div>`;
    }

    function scrollToBottom(player) {
      player.stream.scrollTop = player.stream.scrollHeight;
    }

    function typeInto(element, text, player, onDone) {
      let cursor = 0;
      element.classList.add("cursor");
      element.textContent = "";

      function tick() {
        if (!player.running) return;
        cursor += 1;
        element.textContent = text.slice(0, cursor);
        scrollToBottom(player);

        if (cursor >= text.length) {
          element.classList.remove("cursor");
          onDone();
          return;
        }

        player.timer = window.setTimeout(tick, typeDelay);
      }

      tick();
    }

    function showNext(name) {
      const player = players[name];
      const flow = flows[name];

      if (player.index >= flow.length) {
        finish(name);
        return;
      }

      clearEmpty(player);
      const item = flow[player.index];
      const { wrapper, bubble } = createMessage(item);
      player.stream.appendChild(wrapper);
      scrollToBottom(player);
      player.index += 1;

      const continueFlow = () => {
        if (!player.running) return;
        player.timer = window.setTimeout(() => showNext(name), delayBetweenMessages);
      };

      if (item.stream) {
        typeInto(bubble, item.content, player, continueFlow);
      } else {
        bubble.textContent = item.content;
        continueFlow();
      }
    }

    function start(name) {
      const player = players[name];
      if (player.running) {
        pause(name);
        return;
      }

      if (player.done) reset(name);
      player.running = true;
      player.playBtn.textContent = "暂停";
      showNext(name);
    }

    function pause(name) {
      const player = players[name];
      player.running = false;
      if (player.timer) window.clearTimeout(player.timer);
      player.timer = null;
      player.playBtn.textContent = "继续播放";
    }

    function finish(name) {
      const player = players[name];
      player.running = false;
      player.done = true;
      if (player.timer) window.clearTimeout(player.timer);
      player.timer = null;
      player.playBtn.textContent = "重新播放";
    }

    function reset(name) {
      const player = players[name];
      player.running = false;
      player.done = false;
      player.index = 0;
      if (player.timer) window.clearTimeout(player.timer);
      player.timer = null;
      player.playBtn.textContent = "开始自动播放";
      showEmpty(player);
    }

    players.off.playBtn.addEventListener("click", () => start("off"));
    players.on.playBtn.addEventListener("click", () => start("on"));
    players.off.resetBtn.addEventListener("click", () => reset("off"));
    players.on.resetBtn.addEventListener("click", () => reset("on"));
  </script>
</body>
</html>
