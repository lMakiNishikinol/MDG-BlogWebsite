<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Loop 多轮工具调用演示</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #20262b;
      --muted: #66717b;
      --line: #d8d2c7;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --green: #0f766e;
      --green-soft: #ccfbf1;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --violet: #6d28d9;
      --violet-soft: #ede9fe;
      --gray-soft: #f4f4f5;
      --shadow: 0 12px 32px rgba(32, 38, 43, 0.10);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      width: min(1080px, calc(100vw - 32px));
      margin: 28px auto;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      min-width: 250px;
    }

    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      padding: 0 14px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(32, 38, 43, 0.03);
    }

    button.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #ffffff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .task {
      margin-bottom: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .task-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .task-text {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.35;
    }

    .stage-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .stage {
      min-height: 74px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfaf7;
    }

    .stage strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .stage span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .stage.active {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .stream-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfaf7;
    }

    .stream-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .stream {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 640px;
      padding: 16px;
      overflow-y: auto;
      scroll-behavior: smooth;
      background:
        linear-gradient(#ffffff, #ffffff) padding-box,
        repeating-linear-gradient(0deg, rgba(37, 99, 235, 0.04), rgba(37, 99, 235, 0.04) 1px, transparent 1px, transparent 34px);
    }

    .message {
      display: grid;
      gap: 6px;
      opacity: 0;
      transform: translateY(8px);
      animation: rise 220ms ease forwards;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .role {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: lowercase;
    }

    .bubble {
      width: min(100%, 760px);
      border: 1px solid #d7dce2;
      border-radius: var(--radius);
      padding: 11px 12px;
      background: #f8fafc;
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.user .role {
      margin-left: auto;
    }

    .message.user .bubble {
      background: var(--blue-soft);
      border-color: #bfdbfe;
    }

    .message.system .role {
      background: var(--gray-soft);
      color: #52525b;
    }

    .message.tools .role {
      background: var(--violet-soft);
      color: var(--violet);
    }

    .message.user .role {
      background: var(--blue);
      color: white;
    }

    .message.llm .role {
      background: var(--green-soft);
      color: #134e4a;
    }

    .message.tool .role {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .message.llm .bubble {
      background: #f0fdfa;
      border-color: #99f6e4;
    }

    .message.tools .bubble {
      background: #f5f3ff;
      border-color: #ddd6fe;
    }

    .message.tool .bubble {
      background: #fffbeb;
      border-color: #fde68a;
    }

    .json {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
    }

    .cursor::after {
      content: "";
      display: inline-block;
      width: 7px;
      height: 1em;
      margin-left: 2px;
      background: currentColor;
      vertical-align: -2px;
      animation: blink 900ms steps(2, start) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .empty-state {
      margin: auto;
      max-width: 420px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      header {
        display: block;
      }

      .controls {
        justify-content: flex-start;
        margin-top: 12px;
      }

      .stage-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100vw - 20px, 1080px);
        margin: 18px auto;
      }

      h1 {
        font-size: 23px;
      }

      .task-text {
        font-size: 18px;
      }

      .stage-row {
        grid-template-columns: 1fr;
      }

      .stream-header {
        display: block;
      }

      .status {
        margin-top: 6px;
      }

      .stream {
        height: 560px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Agent Loop 多轮工具调用演示</h1>
        <p class="lead">教学版消息流演示：模型每次看到新的工具结果后，再决定下一步是否继续调用工具。</p>
      </div>
      <div class="controls">
        <button class="primary" id="playBtn" type="button">开始自动播放</button>
        <button id="stepBtn" type="button">下一条</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
    </header>

    <section class="task" aria-label="用户任务">
      <span class="task-label">用户任务</span>
      <div class="task-text">请读取 notes.txt，总结成 5 条要点，并写入 summary.md。</div>
    </section>

    <section class="stage-row" aria-label="执行阶段">
      <div class="stage" data-stage="start">
        <strong>准备</strong>
        <span>模型看到系统提示词、工具说明和用户任务。</span>
      </div>
      <div class="stage" data-stage="list">
        <strong>第 1 轮</strong>
        <span>查看当前目录，确认目标文件是否存在。</span>
      </div>
      <div class="stage" data-stage="read">
        <strong>第 2 轮</strong>
        <span>读取 notes.txt，获得真实文件内容。</span>
      </div>
      <div class="stage" data-stage="write">
        <strong>第 3 轮</strong>
        <span>写入 summary.md，并输出完成结果。</span>
      </div>
    </section>

    <section class="panel">
      <div class="stream-header">
        <h2 class="stream-title">消息流</h2>
        <div class="status" id="status">等待开始</div>
      </div>
      <div class="stream" id="stream" aria-label="Agent Loop 消息流">
        <div class="empty-state">点击“开始自动播放”，查看多轮工具调用如何一步步完成任务。</div>
      </div>
    </section>
  </main>

  <script>
    const delayBetweenMessages = 520;
    const typeDelay = 12;

    const flow = [
      {
        role: "system",
        stage: "start",
        content: "你是一个文件助手。需要查看目录时使用 list_files，需要读取文件时使用 read_file，需要写入文件时使用 write_file。不能编造未读取到的文件内容。"
      },
      {
        role: "tools",
        stage: "start",
        format: "json",
        content: `[
  {
    "name": "list_files",
    "description": "列出指定目录下的文件。",
    "parameters": {
      "path": {
        "type": "string",
        "description": "要查看的目录路径。"
      }
    }
  },
  {
    "name": "read_file",
    "description": "读取指定文件内容。",
    "parameters": {
      "path": {
        "type": "string",
        "description": "要读取的文件路径。"
      }
    }
  },
  {
    "name": "write_file",
    "description": "写入文件内容。",
    "parameters": {
      "path": {
        "type": "string",
        "description": "要写入的文件路径。"
      },
      "content": {
        "type": "string",
        "description": "要写入的文本内容。"
      }
    }
  }
]`
      },
      {
        role: "user",
        stage: "start",
        content: "请读取 notes.txt，总结成 5 条要点，并写入 summary.md。"
      },
      {
        role: "llm",
        stage: "list",
        stream: true,
        format: "json",
        content: `{
  "tool": "list_files",
  "arguments": {
    "path": "."
  }
}`
      },
      {
        role: "tool",
        stage: "list",
        format: "json",
        content: `{
  "path": ".",
  "files": [
    "notes.txt",
    "todo.md",
    "archive/"
  ]
}`
      },
      {
        role: "llm",
        stage: "read",
        stream: true,
        format: "json",
        content: `{
  "tool": "read_file",
  "arguments": {
    "path": "notes.txt"
  }
}`
      },
      {
        role: "tool",
        stage: "read",
        format: "json",
        content: `{
  "path": "notes.txt",
  "content": "今天讨论了 Agent 的基本结构：LLM 不直接执行外部动作，而是通过工具调用请求让外部程序执行。工具结果会回到上下文。上下文窗口有限，长文件需要筛选和摘要。结构化输出可以让工具调用更稳定。复杂任务可以考虑拆分，但 SubAgent 会带来编排成本。"
}`
      },
      {
        role: "llm",
        stage: "write",
        stream: true,
        format: "json",
        content: `{
  "tool": "write_file",
  "arguments": {
    "path": "summary.md",
    "content": "1. Agent 由 LLM、工具和执行流程组合而成。\\n2. LLM 不直接执行外部动作，而是生成工具调用请求。\\n3. 工具执行结果会回到上下文，影响模型后续输出。\\n4. 上下文窗口有限，长文件需要筛选、摘要或分段处理。\\n5. 复杂任务可以拆分，但 SubAgent 需要清晰的职责和交接方式。"
  }
}`
      },
      {
        role: "tool",
        stage: "write",
        format: "json",
        content: `{
  "ok": true,
  "path": "summary.md",
  "bytes_written": 267
}`
      },
      {
        role: "llm",
        stage: "write",
        stream: true,
        content: "已读取 notes.txt，并将 5 条要点写入 summary.md。"
      }
    ];

    const stream = document.getElementById("stream");
    const statusEl = document.getElementById("status");
    const playBtn = document.getElementById("playBtn");
    const stepBtn = document.getElementById("stepBtn");
    const resetBtn = document.getElementById("resetBtn");
    let index = 0;
    let timer = null;
    let running = false;
    let done = false;

    function createMessage(item) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${item.role}`;

      const role = document.createElement("div");
      role.className = "role";
      role.textContent = item.role;

      const bubble = document.createElement("div");
      bubble.className = item.format === "json" ? "bubble json" : "bubble";

      wrapper.appendChild(role);
      wrapper.appendChild(bubble);
      return { wrapper, bubble };
    }

    function clearEmpty() {
      const empty = stream.querySelector(".empty-state");
      if (empty) empty.remove();
    }

    function showEmpty() {
      stream.innerHTML = `<div class="empty-state">点击“开始自动播放”，查看多轮工具调用如何一步步完成任务。</div>`;
    }

    function scrollToBottom() {
      stream.scrollTop = stream.scrollHeight;
    }

    function updateStage(stage) {
      document.querySelectorAll(".stage").forEach(el => {
        el.classList.toggle("active", el.dataset.stage === stage);
      });
    }

    function updateStatus(item) {
      if (!item) {
        statusEl.textContent = done ? "完成" : "等待开始";
        return;
      }
      const labels = {
        start: "准备上下文",
        list: "第 1 轮：查看文件列表",
        read: "第 2 轮：读取文件内容",
        write: "第 3 轮：写入总结并完成"
      };
      statusEl.textContent = labels[item.stage] || "播放中";
    }

    function typeInto(element, text, onDone) {
      let cursor = 0;
      element.classList.add("cursor");
      element.textContent = "";

      function tick() {
        if (!running) return;
        cursor += 1;
        element.textContent = text.slice(0, cursor);
        scrollToBottom();

        if (cursor >= text.length) {
          element.classList.remove("cursor");
          onDone();
          return;
        }

        timer = window.setTimeout(tick, typeDelay);
      }

      tick();
    }

    function showNext({ auto = false } = {}) {
      if (done || index >= flow.length) {
        finish();
        return;
      }

      clearEmpty();
      const item = flow[index];
      const { wrapper, bubble } = createMessage(item);
      stream.appendChild(wrapper);
      updateStage(item.stage);
      updateStatus(item);
      scrollToBottom();
      index += 1;

      const continueAuto = () => {
        if (!running || !auto) return;
        timer = window.setTimeout(() => showNext({ auto: true }), delayBetweenMessages);
      };

      if (item.stream && auto) {
        typeInto(bubble, item.content, continueAuto);
      } else {
        bubble.textContent = item.content;
        continueAuto();
      }

      if (!auto && index >= flow.length) finish();
    }

    function start() {
      if (running) {
        pause();
        return;
      }

      if (done) reset();
      running = true;
      playBtn.textContent = "暂停";
      stepBtn.disabled = true;
      showNext({ auto: true });
    }

    function pause() {
      running = false;
      if (timer) window.clearTimeout(timer);
      timer = null;
      playBtn.textContent = "继续播放";
      stepBtn.disabled = false;
    }

    function finish() {
      running = false;
      done = true;
      if (timer) window.clearTimeout(timer);
      timer = null;
      playBtn.textContent = "重新播放";
      stepBtn.disabled = true;
      updateStatus(null);
      updateStage("write");
    }

    function reset() {
      running = false;
      done = false;
      index = 0;
      if (timer) window.clearTimeout(timer);
      timer = null;
      playBtn.textContent = "开始自动播放";
      stepBtn.disabled = false;
      showEmpty();
      updateStatus(null);
      updateStage("start");
    }

    playBtn.addEventListener("click", start);
    stepBtn.addEventListener("click", () => showNext({ auto: false }));
    resetBtn.addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
